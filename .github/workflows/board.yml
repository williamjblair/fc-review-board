name: Build review board

on:
  schedule:
    # Asked for hourly. GitHub spaces scheduled runs out under load, so in
    # practice this fires every two to three hours.
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

# Never cancel an in-flight deploy; let each run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check out the exact public FC audit packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: williamjblair/formal-conjectures
          ref: 50fb575fadfc710f2da66cba1d3909429f9ba25e
          path: .fc-pr-audit-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate and project the exact FC per-PR audit records
        env:
          FC_PR_AUDIT_SOURCE: ${{ github.workspace }}/.fc-pr-audit-source
        run: |
          test "$(git -C "$FC_PR_AUDIT_SOURCE" rev-parse HEAD)" = 50fb575fadfc710f2da66cba1d3909429f9ba25e
          test "$(git -C "$FC_PR_AUDIT_SOURCE" rev-parse HEAD^{tree})" = 7213fa92375028e13797fc89f2cc300fc0568869
          python3 -B fc_pr_audit.py --source "$FC_PR_AUDIT_SOURCE" --output pr_audits.json
          python3 -B -m unittest -v test_fc_pr_audit.py

      - name: Build the bounded #4884 pilot report
        env:
          FC_PR_AUDIT_SOURCE: ${{ github.workspace }}/.fc-pr-audit-source
          GH_TOKEN: ${{ github.token }}
        run: |
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh pr view 4884 --repo google-deepmind/formal-conjectures \
            --json number,headRefOid,state,reviewDecision,url \
            | jq --arg observed_at "$observed_at" '{
                number,
                head_commit_oid: .headRefOid,
                state,
                review_decision: (.reviewDecision // null),
                observed_at: $observed_at,
                repository: "google-deepmind/formal-conjectures",
                url
              }' > pilot_github.json
          python3 -B review_report.py "$FC_PR_AUDIT_SOURCE" \
            conditional-erdos-427-4884 \
            --github-json pilot_github.json \
            --comparator-json pilot/comparator-outcome.json \
            --output pilot_review_report.json
          python3 -B -c 'import pilot; assert pilot.load_pilot_bundle()'
          python3 -B -m unittest -v test_review_report.py test_pilot.py

      # No audit feed by default. Set a VERDICTS_URL repository variable to
      # point at one and the fidelity column appears; without it the board
      # depends on nothing but GitHub.
      - name: Fetch audit feed
        if: vars.VERDICTS_URL != ''
        env:
          VERDICTS_URL: ${{ vars.VERDICTS_URL }}
        run: curl -sfL "$VERDICTS_URL" -o verdicts.json

      # PR state and timings come from queueboard, the tool mathlib's review
      # dashboard is built on, so the fetching and the "what counts as awaiting
      # review" rules are maintained upstream rather than here. sync.sh clones
      # it, repoints three mathlib-specific constants, and writes snapshot.json.
      #
      # Deliberately stateless: no cached PR data, so nothing can go stale or
      # need repairing. A cold run costs about 600 of the 5000 hourly
      # rate-limit points and roughly a minute.
      - name: Sync PR state
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./sync.sh

      # generate.py reads snapshot.json, the issue list, the base branch's file
      # list and the audit feed, and writes the generated workbench below the
      # static public landing page. It exits non-zero if the snapshot is missing or empty, so a
      # bad run fails rather than deploying an empty board; the last good
      # deploy stays and the next scheduled run retries.
      - name: Generate board
        run: |
          python3 generate.py
          mkdir -p _site/workbench
          cp landing.html _site/index.html
          cp -R assets _site/assets
          cp workbench/index.html _site/workbench/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
