name: Build review board

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege for the official GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let each run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Fetch audit feed
        env:
          VERDICTS_URL: ${{ vars.VERDICTS_URL }}
        run: |
          curl -sfL "${VERDICTS_URL:-https://erdos.constellate.science/verdicts.json}" -o verdicts.json

      # PR state and timings come from queueboard, the tool mathlib's review
      # dashboard is built on, so the fetching and the "what counts as awaiting
      # review" rules are maintained upstream rather than here. sync.sh clones
      # it, repoints three mathlib-specific constants, and writes snapshot.json.
      #
      # Deliberately stateless: no cached PR data, so nothing can go stale or
      # need repairing. A cold run costs ~1100 of the 5000 hourly rate-limit
      # points and a few minutes, which an hourly schedule absorbs easily.
      - name: Sync PR state
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./sync.sh

      # generate.py reads snapshot.json plus the audit feed and writes
      # index.html. It exits non-zero if the snapshot is missing or empty, so a
      # bad run fails rather than deploying an empty board; the last good
      # deploy stays and the hourly cron retries.
      - name: Generate board
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 generate.py
          mkdir -p _site
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
